# Render Blueprint (https://render.com/docs/blueprint-spec). Apply via
# Render dashboard -> New -> Blueprint, pointing at this repo. This
# monorepo has two deployable apps (backend/, frontend/) plus a database;
# rootDir tells Render which subdirectory each service's Dockerfile lives in
# since there is no Dockerfile at the repo root.
#
# Render's Blueprint schema has changed field names across versions (e.g.
# `env` vs `runtime`) -- if `render blueprint` or the dashboard rejects a
# key here, check Render's current Blueprint spec for the equivalent name;
# this was written to the schema as documented at the time this was added,
# not verified against a live Render account.
#
# Manual steps required after the first apply (Render intentionally will
# not auto-fill these -- see each envVar's `sync: false` below):
#   1. CREDENTIAL_ENCRYPTION_KEY on tradingmaster-backend: generate with
#      `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
#      Render's own envVar auto-generation does not produce a valid Fernet
#      key, so this cannot use `generateValue: true`.
#   2. SEED_ADMIN_PASSWORD on tradingmaster-backend: set a real password --
#      do not deploy with the repo's dev default (ChangeMe123!) reachable
#      on the public internet.
#   3. CORS_ORIGINS on tradingmaster-backend: once tradingmaster-frontend
#      has a URL (e.g. https://tradingmaster-frontend.onrender.com), set
#      this to ["https://tradingmaster-frontend.onrender.com"].
#   4. NEXT_PUBLIC_API_URL on tradingmaster-frontend: once
#      tradingmaster-backend has a URL, set this to it (e.g.
#      https://tradingmaster-backend.onrender.com) and trigger a redeploy
#      of the frontend -- this value is baked in at build time (see
#      frontend/Dockerfile), so changing it after the fact requires a
#      rebuild, not just a restart.

databases:
  - name: tradingmaster-db
    databaseName: tradingmaster
    user: tradingmaster
    plan: free

services:
  - type: web
    name: tradingmaster-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradingmaster-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@tradingmaster.internal
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: tradingmaster-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
