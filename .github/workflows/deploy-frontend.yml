name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        # Fails fast with a real error message here instead of a remote
        # build's opaque "npm run build exited with 1" -- this is how the
        # DESKTOP_BUILD/output:"standalone" bug got found originally.
        env:
          NEXT_PUBLIC_API_URL: https://api.tradingmaster.online
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/tradingmaster/TradingMaster
            git fetch origin master
            git reset --hard origin/master
            cd /opt/tradingmaster
            docker compose -f docker-compose.prod.yml --env-file .env build frontend
            docker compose -f docker-compose.prod.yml --env-file .env up -d frontend

      - name: Wait for health check
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://tradingmaster.online || true)
            if [ "$code" = "200" ]; then
              echo "Frontend healthy."
              exit 0
            fi
            echo "Not healthy yet (attempt $i, status $code), waiting..."
            sleep 10
          done
          echo "::error::Frontend did not become healthy after redeploy"
          exit 1
