name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        # Fails fast with a real error message here instead of the opaque
        # "npm run build exited with 1" InsForge's remote build reports --
        # this is how the DESKTOP_BUILD/output:"standalone" bug got found.
        env:
          NEXT_PUBLIC_API_URL: https://tradingmaster-api-63582f22-3b10-42bd-8e1f-0b1d3255e268.fly.dev
        run: npm run build

      - name: Deploy to InsForge
        run: |
          npx -y @insforge/cli login --user-api-key "${{ secrets.INSFORGE_USER_API_KEY }}"
          npx -y @insforge/cli link --project-id 63582f22-3b10-42bd-8e1f-0b1d3255e268 -y
          npx -y @insforge/cli deployments deploy .
