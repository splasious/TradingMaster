name: Backfill health check

# A read-only look at the backfill data in the VPS database, run on demand.
# This repository is public and so is this job's log, so it only prints
# counts and statuses (backend/scripts/backfill_health_summary.sql) -- no
# symbol names, no error text. For the per-symbol detail, run
# backend/scripts/backfill_health_check.sql on the server itself (see the
# command at the top of that file).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/scripts

      - name: Check backfill data on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps

          # Runs on the VPS: $1 says what to do; for "sql", $2 is the query
          # file already uploaded there (removed once run).
          cat > "$RUNNER_TEMP/remote.sh" <<'REMOTE'
          set -eu
          cd /opt/tradingmaster
          compose() { docker compose -f docker-compose.prod.yml --env-file .env "$@"; }
          case "$1" in
            status)
              compose ps --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'
              df -h / | awk 'NR == 2 {print "Disk: " $3 " used of " $2 " (" $5 ")"}'
              ;;
            sql)
              trap 'rm -f "$2"' EXIT
              db=$(compose ps --services --status running | grep -m1 -ixE 'postgres|postgresql|db|database' || true)
              if [ -z "$db" ]; then
                db=$(compose ps --format '{{.Service}} {{.Image}}' | awk 'tolower($2) ~ /postgres|timescale|pgvector|postgis/ {print $1; exit}')
              fi
              if [ -z "$db" ]; then echo "No running Postgres container found" >&2; exit 3; fi
              compose exec -T "$db" \
                sh -c 'psql -X -q -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-${POSTGRES_USER:-postgres}}"' < "$2"
              ;;
            log-counts)
              # Counts only -- the lines themselves stay on the server.
              compose logs --since 72h --no-color backend > /tmp/backend-72h.log 2>&1 || true
              for pattern in 'Traceback' 'backfill.*(error|fail)' 'catalog.sync.*(error|fail)' \
                             'IntegrityError|UniqueViolation' 'StringDataRightTruncation|value too long'; do
                printf '%-40s %s\n' "$pattern" "$(grep -ciE "$pattern" /tmp/backend-72h.log || true)"
              done
              # Where tracebacks came from: our own file/function names, the
              # exception type and the time -- never the message text.
              echo "-- Traceback times (UTC):"
              compose logs --since 72h --no-color --timestamps backend 2>/dev/null | grep -F 'Traceback' \
                | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}' | head -10 || true
              echo "-- Frames in our code (count, file, function):"
              grep -oE 'File "(/app/app/[A-Za-z0-9_/]+\.py|<native-strategy:[0-9a-f-]+>)", line [0-9]+, in [A-Za-z0-9_<>]+' /tmp/backend-72h.log \
                | sed -E 's#File "/app/##; s#File "<native-strategy:[0-9a-f-]+>#native strategy code#; s#", line [0-9]+, in #  #' \
                | sort | uniq -c | sort -rn | head -12 || true
              echo "-- Exception types (count):"
              grep -oE '\| ([A-Za-z_][A-Za-z0-9_]*\.)*[A-Za-z_]*(Error|Exception|Timeout|Refused|Interrupt)[A-Za-z]*:' /tmp/backend-72h.log \
                | sed -E 's/^\| //; s/:$//' | sort | uniq -c | sort -rn | head -8 || true
              rm -f /tmp/backend-72h.log
              ;;
            web-today)
              # Today since 09:00 IST, counts only: API answers by URL pattern
              # (ids and query strings masked) and status; live-price
              # websocket opens/closes; the chart-candle sync's failures by
              # data source and timeframe (symbols masked); frontend errors
              # by kind. No IPs, names or message text.
              since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 09:00 IST" +%Y-%m-%dT%H:%M:%SZ)
              compose logs --since "$since" --no-color backend > /tmp/backend-today.log 2>&1 || true
              compose logs --since "$since" --no-color frontend > /tmp/frontend-today.log 2>&1 || true
              echo "-- since $since: backend lines $(wc -l < /tmp/backend-today.log), frontend lines $(wc -l < /tmp/frontend-today.log)"
              echo "-- API answers (count, method, path, status):"
              grep -oE '"(GET|POST|PUT|PATCH|DELETE) /api/v1/[^ ?"]*[^"]*" [0-9]{3}' /tmp/backend-today.log \
                | sed -E 's/\?[^ ]*//; s#/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}#/{id}#g; s# HTTP/[0-9.]+"#"#; s/"//g' \
                | sort | uniq -c | sort -rn | head -40 || true
              echo "-- Session refresh and login calls, in order (IST time, call, status) -- times only:"
              compose logs --since "$since" --no-color --timestamps backend 2>/dev/null \
                | grep -E '"POST /api/v1/auth/(refresh|login|logout)' \
                | sed -E 's/^[^ ]+ +\| +//' \
                | awk '{t = $0; sub(/ .*/, "", t); match($0, /\/api\/v1\/auth\/[a-z]+/); call = substr($0, RSTART + 13, RLENGTH - 13);
                        match($0, /HTTP\/[0-9.]+" [0-9]+/); st = substr($0, RSTART + RLENGTH - 3, 3); print t, call, st}' \
                | while read -r t call st; do printf '%s %-8s %s\n' "$(TZ=Asia/Kolkata date -d "$t" +%H:%M:%S)" "$call" "$st"; done \
                | tail -60 || true
              echo "-- Websocket (count, line kind):"
              grep -oE '"WebSocket [^ ?"]+[^"]*" \[?[a-z]+\]?|connection (open|closed)' /tmp/backend-today.log \
                | sed -E 's/\?[^ "]*//; s#/[0-9a-f-]{36}#/{id}#g' | sort | uniq -c | sort -rn | head -10 || true
              echo "-- Candle sync failures (count, data source named in the error):"
              grep -oE "No market data source registered for '[A-Za-z0-9_]+'" /tmp/backend-today.log | sort | uniq -c || true
              echo "-- Candle sync failures (failures, distinct instruments, timeframe, NIFTY or other):"
              grep -oE 'Active timeframe sync failed for .*:[0-9]+[a-z]+' /tmp/backend-today.log \
                | sed -E 's/Active timeframe sync failed for //' \
                | awk '{n = split($0, a, ":"); kind = ($0 ~ /^NIFTY/) ? "NIFTY" : "other"; print a[n] "|" kind "|" $0}' \
                | sort | uniq -c \
                | awk '{split($2, b, "|"); k = b[1] " " b[2]; inst[k]++; fails[k] += $1}
                       END {for (k in inst) printf "%7d %4d  %s\n", fails[k], inst[k], k}' || true
              echo "-- Frontend log lines by kind (count):"
              grep -oiE '(ChunkLoadError|TypeError|ReferenceError|SyntaxError|Unhandled|ECONNREFUSED|ETIMEDOUT|fetch failed|Error: [A-Za-z ]{0,30}|digest)' /tmp/frontend-today.log \
                | sed -E 's/Error: .*/Error: (text)/' | sort | uniq -c | sort -rn | head -10 || true
              rm -f /tmp/backend-today.log /tmp/frontend-today.log
              ;;
          esac
          REMOTE

          vps() {
            ssh -i ~/.ssh/vps -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
              -o ConnectTimeout=20 "root@$VPS_HOST" "$@"
          }
          remote() { vps bash -s -- "$@" < "$RUNNER_TEMP/remote.sh"; }

          echo "== Containers"
          remote status

          # Uploaded over stdin: passed base64-encoded as one argument, the
          # query file outgrew Linux's 128 KB limit on a single argument.
          sql_file=$(vps 'f=$(mktemp /tmp/health-XXXXXX.sql) && cat > "$f" && echo "$f"' < backend/scripts/backfill_health_summary.sql)
          remote sql "$sql_file"

          echo
          echo "== Backend log lines in the last 72 hours matching (count)"
          remote log-counts

          echo
          echo "== Today on the site since 09:00 IST (counts only)"
          remote web-today

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/vps
