name: Backfill health check

# A read-only look at the backfill data in the VPS database, run on demand.
# This repository is public and so is this job's log, so it only prints
# counts and statuses (backend/scripts/backfill_health_summary.sql) -- no
# symbol names, no error text. For the per-symbol detail, run
# backend/scripts/backfill_health_check.sql on the server itself (see the
# command at the top of that file).

on:
  workflow_dispatch:
    inputs:
      oi_preview:
        description: "Instead of the check: send the latest OI-levels picture and the latest closed trade's alert picture to the private Telegram chat only (not the group)"
        type: boolean
        default: false
      kotak_data_check:
        description: "Instead of the check: read-only comparison of Kotak Neo's market data with Zerodha's (backend/scripts/kotak_data_check.py)"
        type: boolean
        default: false
      breakout_backtest:
        description: "Instead of the check: backtest 52 Candle Breakout (the candles: RUN in the script -- 15/30/45/75-min built from the stored 15m ones, or daily/weekly/monthly from the stored daily ones); results to the private Telegram chat only (backend/scripts/breakout_backtest.py)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/scripts

      - name: Check backfill data on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Passed in here, not written into the script: a script with an
          # expression in it is one expression to GitHub, and this one is
          # past its 21,000-character limit.
          OI_PREVIEW: ${{ inputs.oi_preview }}
          KOTAK_DATA_CHECK: ${{ inputs.kotak_data_check }}
          BREAKOUT_BACKTEST: ${{ inputs.breakout_backtest }}
        run: |
          set -euo pipefail
          umask 077

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps

          # Runs on the VPS: $1 says what to do; for "sql", $2 is the query
          # file already uploaded there (removed once run).
          cat > "$RUNNER_TEMP/remote.sh" <<'REMOTE'
          set -eu
          cd /opt/tradingmaster
          compose() { docker compose -f docker-compose.prod.yml --env-file .env "$@"; }
          case "$1" in
            status)
              compose ps --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'
              df -h / | awk 'NR == 2 {print "Disk: " $3 " used of " $2 " (" $5 ")"}'
              ;;
            sql)
              trap 'rm -f "$2"' EXIT
              db=$(compose ps --services --status running | grep -m1 -ixE 'postgres|postgresql|db|database' || true)
              if [ -z "$db" ]; then
                db=$(compose ps --format '{{.Service}} {{.Image}}' | awk 'tolower($2) ~ /postgres|timescale|pgvector|postgis/ {print $1; exit}')
              fi
              if [ -z "$db" ]; then echo "No running Postgres container found" >&2; exit 3; fi
              compose exec -T "$db" \
                sh -c 'psql -X -q -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-${POSTGRES_USER:-postgres}}"' < "$2"
              ;;
            log-counts)
              # Counts only -- the lines themselves stay on the server.
              compose logs --since 72h --no-color backend > /tmp/backend-72h.log 2>&1 || true
              for pattern in 'Traceback' 'backfill.*(error|fail)' 'catalog.sync.*(error|fail)' \
                             'IntegrityError|UniqueViolation' 'StringDataRightTruncation|value too long'; do
                printf '%-40s %s\n' "$pattern" "$(grep -ciE "$pattern" /tmp/backend-72h.log || true)"
              done
              # Where tracebacks came from: our own file/function names, the
              # exception type and the time -- never the message text.
              echo "-- Traceback times (UTC):"
              compose logs --since 72h --no-color --timestamps backend 2>/dev/null | grep -F 'Traceback' \
                | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}' | head -10 || true
              echo "-- Frames in our code (count, file, function):"
              grep -oE 'File "(/app/app/[A-Za-z0-9_/]+\.py|<native-strategy:[0-9a-f-]+>)", line [0-9]+, in [A-Za-z0-9_<>]+' /tmp/backend-72h.log \
                | sed -E 's#File "/app/##; s#File "<native-strategy:[0-9a-f-]+>#native strategy code#; s#", line [0-9]+, in #  #' \
                | sort | uniq -c | sort -rn | head -12 || true
              echo "-- Exception types (count):"
              grep -oE '\| ([A-Za-z_][A-Za-z0-9_]*\.)*[A-Za-z_]*(Error|Exception|Timeout|Refused|Interrupt)[A-Za-z]*:' /tmp/backend-72h.log \
                | sed -E 's/^\| //; s/:$//' | sort | uniq -c | sort -rn | head -8 || true
              rm -f /tmp/backend-72h.log
              ;;
            web-today)
              # Today since 09:00 IST, counts only: API answers by URL pattern
              # (ids and query strings masked) and status; live-price
              # websocket opens/closes; the chart-candle sync's failures by
              # data source and timeframe (symbols masked); frontend errors
              # by kind. No IPs, names or message text.
              since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 09:00 IST" +%Y-%m-%dT%H:%M:%SZ)
              compose logs --since "$since" --no-color backend > /tmp/backend-today.log 2>&1 || true
              compose logs --since "$since" --no-color frontend > /tmp/frontend-today.log 2>&1 || true
              echo "-- since $since: backend lines $(wc -l < /tmp/backend-today.log), frontend lines $(wc -l < /tmp/frontend-today.log)"
              echo "-- API answers (count, method, path, status):"
              grep -oE '"(GET|POST|PUT|PATCH|DELETE) /api/v1/[^ ?"]*[^"]*" [0-9]{3}' /tmp/backend-today.log \
                | sed -E 's/\?[^ ]*//; s#/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}#/{id}#g; s# HTTP/[0-9.]+"#"#; s/"//g' \
                | sort | uniq -c | sort -rn | head -40 || true
              echo "-- Browser pre-flight (OPTIONS) answers (count, path, status):"
              grep -oE '"OPTIONS /api/v1/[^ ?"]*[^"]*" [0-9]{3}' /tmp/backend-today.log \
                | sed -E 's/\?[^ ]*//; s#/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}#/{id}#g; s# HTTP/[0-9.]+"#"#; s/"//g' \
                | sort | uniq -c | sort -rn | head -10 || true
              echo "-- Site addresses the backend accepts calls from (CORS), the site's own domain shown as <site>:"
              compose exec -T backend printenv CORS_ORIGINS 2>/dev/null | tr -d '[]" ' | tr ',' '\n' \
                | sed -E 's#^(https?://)(.*\.)?[a-z0-9-]+\.[a-z]+(:[0-9]+)?/?$#\1\2<site>\3#' || true
              echo "-- Site addresses the web server (Caddy) answers on, same masking:"
              compose exec -T caddy sh -c 'cat /etc/caddy/Caddyfile' 2>/dev/null | grep -oE '^[^ #][^{]*' \
                | tr ', ' '\n\n' | grep -E '\.' | sed -E 's#^(https?://)?(.*\.)?([a-z0-9-]+\.[a-z]+)$#\2<site>#' | sort -u || true
              echo "-- Session refresh and login calls, in order (IST time, call, status) -- times only:"
              compose logs --since "$since" --no-color --timestamps backend 2>/dev/null \
                | grep -E '"POST /api/v1/auth/(refresh|login|logout)' \
                | sed -E 's/^[^ ]+ +\| +//' \
                | awk '{t = $0; sub(/ .*/, "", t); match($0, /\/api\/v1\/auth\/[a-z]+/); call = substr($0, RSTART + 13, RLENGTH - 13);
                        match($0, /HTTP\/[0-9.]+" [0-9]+/); st = substr($0, RSTART + RLENGTH - 3, 3); print t, call, st}' \
                | while read -r t call st; do printf '%s %-8s %s\n' "$(TZ=Asia/Kolkata date -d "$t" +%H:%M:%S)" "$call" "$st"; done \
                | tail -60 || true
              echo "-- Websocket (count, line kind):"
              grep -oE '"WebSocket [^ ?"]+[^"]*" \[?[a-z]+\]?|connection (open|closed)' /tmp/backend-today.log \
                | sed -E 's/\?[^ "]*//; s#/[0-9a-f-]{36}#/{id}#g' | sort | uniq -c | sort -rn | head -10 || true
              echo "-- Zerodha live feed (Kite ticker) now, as /api/v1/system/health reports it (state and error code only):"
              compose exec -T backend python -c "import json, re, urllib.request; c = json.load(urllib.request.urlopen('http://localhost:8000/api/v1/system/health', timeout=20)).get('components', {}).get('kite_ticker', 'missing'); m = re.match(r'error: *([0-9]+)', c); print('error ' + m.group(1) if m else ('error (no code)' if c.startswith('error') else c))" 2>/dev/null || echo "unavailable"
              echo "-- Telegram alerts set up (bot token and chat ID both set -- yes/no only), and Telegram send failures today (count):"
              compose exec -T backend python -c "from app.core.config import get_settings as g; s = g(); print('yes' if s.telegram_bot_token and s.telegram_chat_id else 'no')" 2>/dev/null || echo "unavailable"
              grep -c 'Telegram send failed' /tmp/backend-today.log || true
              echo "-- The server's Telegram bot is the one the user named (its username compared by md5 -- yes/no/error only):"
              compose exec -T backend python -c "
          import hashlib, json, urllib.request
          from app.core.config import get_settings
          try:
              s = get_settings()
              me = json.load(urllib.request.urlopen('https://api.telegram.org/bot' + s.telegram_bot_token + '/getMe', timeout=15))
              print('yes' if hashlib.md5(me['result']['username'].lower().encode()).hexdigest() == '8c50cd9b733b12d7d50a2a2d81d34ef6' else 'no')
          except Exception:
              print('error')
          " 2>/dev/null || echo "unavailable"
              echo "-- Telegram group for the OI-levels and scanner alerts: found or not, groups the bot has been seen in (no names or IDs), group send failures today (count):"
              compose exec -T backend python -c "import asyncio; from app.services.notifications.telegram_group import group_status; print(asyncio.run(group_status()))" 2>/dev/null || echo "unavailable"
              grep -c 'Telegram group send failed' /tmp/backend-today.log || true
              echo "-- PCR live row (Options > Change in OI): one reading now -- its time, the record it compares with, contracts compared, PCR, NIFTY, ΔOI in lakh, positioning (market levels only), or why there is none:"
              compose exec -T backend python -c "
          import asyncio
          from app.services.options.pcr_live import live_row
          r, why = asyncio.run(live_row('NIFTY'))
          print(f\"yes: {r['ts']:%H:%M:%S} UTC vs record {r['prev_ts']:%H:%M} UTC, {r['oi_change_contracts']} contracts, PCR {r['prev_pcr']:.3f} -> {r['pcr']:.3f}, NIFTY {r['spot']:,.1f}, call {r['call_oi_change'] / 1e5:+.1f} L, put {r['put_oi_change'] / 1e5:+.1f} L, {r['positioning']}\" if r else 'no: ' + str(why))
          " 2>/dev/null || echo "unavailable"
              echo "-- Telegram trade alerts: the strategies alerted on (names only, as the server reads them):"
              compose exec -T backend python -c "from app.services.notifications.trade_alerts import alerted_strategies as a; print(', '.join(sorted(a())) or 'none')" 2>/dev/null || echo "unavailable"
              echo "-- Kotak Neo broker accounts (numbered): status, when set up, why the last login failed (its kind only), and the SHAPE of what was entered -- never the values:"
              compose exec -T backend python -c "
          import asyncio, base64, binascii, json, re
          from sqlalchemy import select
          from sqlalchemy.orm import selectinload
          from app.core.encryption import decrypt_payload
          from app.db.session import AsyncSessionLocal
          from app.models.broker import Broker, BrokerAccount
          from app.services.broker.zerodha_broker import IST
          def secret(v):
              v = (v or '').strip()
              if not v: return 'empty'
              if re.fullmatch(r'[0-9]{6}', v): return 'a 6-digit code, not the key'
              k = v.replace(' ', '').upper()
              try:
                  base64.b32decode(k + '=' * (-len(k) % 8))
              except (binascii.Error, ValueError):
                  return 'not a base32 key'
              return ('base32 key' if len(k) >= 16 else 'too short for a key') + (' (has spaces)' if ' ' in v else '') + (' (lower case)' if v != v.upper() else '')
          def mobile(v):
              v = (v or '').strip()
              if re.fullmatch(r'[+]91[0-9]{10}', v): return '+91 and 10 digits'
              if re.fullmatch(r'[0-9]{10}', v): return '10 digits, no +91'
              return 'empty' if not v else 'other shape'
          def kind(e):
              if not e: return '-'
              l = e.lower()
              if 'non-base32' in l or 'padding' in l: return 'TOTP secret is not a base32 key'
              if 'all required' in l: return 'a field was left empty'
              words = [w for w in ('totp', 'otp', 'mobile', 'ucc', 'consumer', 'mpin', 'credential', 'invalid', 'expired', 'blocked', 'not registered', 'timeout', 'connection') if w in l]
              step = 'TOTP login refused' if 'totp login failed' in l else 'MPIN step refused' if 'mpin validation failed' in l else 'other error'
              return step + (' [words: ' + ', '.join(words) + ']' if words else '')
          async def main():
              async with AsyncSessionLocal() as db:
                  rows = (await db.execute(select(BrokerAccount).join(Broker).where(Broker.code == 'kotak_neo')
                          .options(selectinload(BrokerAccount.credential), selectinload(BrokerAccount.connection))
                          .order_by(BrokerAccount.created_at))).scalars().all()
              print('kotak_neo accounts:', len(rows))
              for n, a in enumerate(rows, 1):
                  try:
                      c = json.loads(decrypt_payload(a.credential.encrypted_payload)) if a.credential else {}
                  except Exception:
                      c = None
                  conn = a.connection
                  print(f'Account {n}: {a.environment}, active {a.is_active}, set up {a.created_at.astimezone(IST):%d %b %H:%M}, status {conn.status if conn else "none"}, last error: {kind(conn.last_error if conn else None)}')
                  if c is None:
                      print('  credentials: could not be read')
                      continue
                  print('  consumer key:', 'entered' if (c.get('consumer_key') or '').strip() else 'empty',
                        '| mobile:', mobile(c.get('mobile_number')),
                        '| UCC:', 'entered' if (c.get('ucc') or '').strip() else 'empty',
                        '| TOTP secret:', secret(c.get('totp_secret')),
                        '| MPIN:', '4 or 6 digits' if re.fullmatch(r'[0-9]{4}|[0-9]{6}', (c.get('mpin') or '').strip()) else 'empty or other shape')
          asyncio.run(main())
          " 2>/dev/null || echo "unavailable"
              echo "-- Static IP for broker orders: does the backend reach the internet over IPv6, and do Kotak Neo's API hosts have IPv6 addresses (yes/no only, no addresses):"
              compose exec -T backend python -c "
          import socket, urllib.request
          try:
              v6 = ':' in urllib.request.urlopen('https://api64.ipify.org', timeout=10).read().decode()
              print('backend goes out over IPv6:', 'yes' if v6 else 'no (IPv4 only)')
          except Exception:
              print('backend goes out over IPv6: could not tell')
          for h in ('mis.kotaksecurities.com', 'cis.kotaksecurities.com', 'lapi.kotaksecurities.com', 'e21.kotaksecurities.com'):
              try:
                  fams = {ai[0] for ai in socket.getaddrinfo(h, 443)}
                  print(h + ':', 'IPv4 and IPv6' if socket.AF_INET6 in fams else 'IPv4 only')
              except Exception:
                  print(h + ':', 'lookup failed')
          " 2>/dev/null || echo "unavailable"
              echo "-- OI-levels alerts today that failed before sending (count):"
              grep -c 'OI levels alert failed' /tmp/backend-today.log || true
              echo "-- AM OP TRD 15 MIN's pool on 20 lakh starting capital (21 Oct), and its capital-raise audit rows (yes/no, count -- no amounts):"
              compose exec -T backend python -c "
          import asyncio
          from sqlalchemy import func, select
          from app.db.session import AsyncSessionLocal
          from app.models.audit import AuditLog
          from app.models.paper_trading import PaperPortfolio
          async def main():
              async with AsyncSessionLocal() as db:
                  caps = (await db.execute(select(PaperPortfolio.initial_capital).where(func.lower(PaperPortfolio.name) == 'am op trd 15 min'))).scalars().all()
                  logs = (await db.execute(select(func.count()).select_from(AuditLog).where(AuditLog.action == 'PAPER_PORTFOLIO_CAPITAL_RAISED'))).scalar()
              print('pools named so:', len(caps), '| on 20 lakh:', 'yes' if caps and all(abs(c - 2000000) < 0.01 for c in caps) else 'no', '| audit rows:', logs)
          asyncio.run(main())
          " 2>/dev/null || echo "unavailable"
              echo "-- OI-levels alerts today sent as the text table because the picture wasn't drawn (count):"
              grep -c 'OI levels picture not drawn' /tmp/backend-today.log || true
              echo "-- Trade alerts today sent without their chart picture (count each): chart not drawn, data not loaded, picture refused by Telegram, alerts failed:"
              for p in 'Trade alert chart not drawn' 'Trade alert chart data not loaded' 'Telegram refused the picture' 'Trade alerts failed for deployment'; do
                printf '%s: %s\n' "$p" "$(grep -c "$p" /tmp/backend-today.log || true)"
              done
              echo "-- Kite ticker events today (IST time, event, close/error code) -- no message text:"
              compose logs --since "$since" --no-color --timestamps backend 2>/dev/null \
                | grep -E 'Kite ticker (connection closed|connection error|refresh failed|: streaming)|Kite allows [0-9]+ per connection' \
                | sed -E 's/^([^ ]+) +[^|]*\| */\1 /' \
                | awk '{t = $1; ev = "other"; code = "";
                        if ($0 ~ /connection closed/) { ev = "closed"; if (match($0, /closed: [0-9]+/)) code = substr($0, RSTART + 8, RLENGTH - 8) }
                        else if ($0 ~ /connection error/) { ev = "error"; if (match($0, /error: [0-9]+/)) code = substr($0, RSTART + 7, RLENGTH - 7) }
                        else if ($0 ~ /refresh failed/) ev = "refresh_failed"
                        else if ($0 ~ /streaming/) ev = "added_instruments"
                        else if ($0 ~ /Kite allows/) ev = "over_3000_cap";
                        print t, ev, code}' \
                | while read -r t ev code; do printf '%s %-18s %s\n' "$(TZ=Asia/Kolkata date -d "$t" +%H:%M:%S)" "$ev" "$code"; done \
                | tail -40 || true
              echo "-- Candle sync failures (count, data source named in the error):"
              grep -oE "No market data source registered for '[A-Za-z0-9_]+'" /tmp/backend-today.log | sort | uniq -c || true
              echo "-- Candle sync failures (failures, distinct instruments, timeframe, NIFTY or other):"
              grep -oE 'Active timeframe sync failed for .*:[0-9]+[a-z]+' /tmp/backend-today.log \
                | sed -E 's/Active timeframe sync failed for //' \
                | awk '{n = split($0, a, ":"); kind = ($0 ~ /^NIFTY/) ? "NIFTY" : "other"; print a[n] "|" kind "|" $0}' \
                | sort | uniq -c \
                | awk '{split($2, b, "|"); k = b[1] " " b[2]; inst[k]++; fails[k] += $1}
                       END {for (k in inst) printf "%7d %4d  %s\n", fails[k], inst[k], k}' || true
              echo "-- Frontend log lines by kind (count):"
              grep -oiE '(ChunkLoadError|TypeError|ReferenceError|SyntaxError|Unhandled|ECONNREFUSED|ETIMEDOUT|fetch failed|Error: [A-Za-z ]{0,30}|digest)' /tmp/frontend-today.log \
                | sed -E 's/Error: .*/Error: (text)/' | sort | uniq -c | sort -rn | head -10 || true
              rm -f /tmp/backend-today.log /tmp/frontend-today.log
              ;;
            oi-preview)
              # The OI-levels picture of the latest in-session NIFTY record and
              # the latest closed trade's alert picture, from real data, to the
              # private chat only (to_group off). Prints counts and yes/no only.
              compose exec -T backend python -c "
          import asyncio
          from sqlalchemy import select
          from app.db.session import AsyncSessionLocal
          from app.models.paper_trading import PaperNativeDeployment, PaperNativeTrade
          from app.models.pcr import SOURCE_LIVE, PcrSnapshot
          from app.models.strategy import Strategy
          from app.services.broker.zerodha_broker import IST
          from app.services.notifications import candle_panel, trade_alerts
          from app.services.notifications.telegram import send_telegram
          from app.services.options import oi_levels

          def view_of(legs):
              # The position isn't kept with the trade: read the view off its legs.
              names = [str(leg.get('instrument_symbol') or '') for leg in legs]
              if any(n.endswith('FUT') for n in names):
                  return {'bias': 'bullish' if legs[0].get('side') == 'long' else 'bearish'}
              kinds = {n[-2:] for n, leg in zip(names, legs) if leg.get('side') == 'short'}
              return {'regime': {frozenset({'CE', 'PE'}): 'sideways', frozenset({'PE'}): 'bullish', frozenset({'CE'}): 'bearish'}.get(frozenset(kinds))}

          async def oi(db):
              snaps = (await db.execute(select(PcrSnapshot).where(PcrSnapshot.underlying == 'NIFTY', PcrSnapshot.source == SOURCE_LIVE,
                       PcrSnapshot.spot.is_not(None)).order_by(PcrSnapshot.ts.desc()).limit(4))).scalars().all()
              snap = next((s for s in snaps if candle_panel.period_start(s.ts) is not None), None)  # in the session: a candle forming
              if snap is None:
                  return print('OI picture: no live NIFTY record in the session')
              built = await oi_levels._sections(db, snap)
              if built is None:
                  return print('OI picture: no levels in that record')
              sections, label = built
              recent, profile = await oi_levels._recent(db, snap), await oi_levels._profile(db, snap)
              photo = await oi_levels._picture(db, snap, sections, label)
              if photo is None:
                  return print('OI picture: not drawn')
              subject, body = oi_levels.caption(snap, sections)
              await send_telegram('Preview · ' + subject, body, photo=photo)
              candles = f'{len(recent.candles)} candles, forming {\"yes\" if recent.forming else \"no\"}' if recent else 'no candles'
              print(f'OI picture: sent ({snap.ts.astimezone(IST):%d %b %H:%M} record, {len(sections)} panel(s), {candles}, '
                    f'{len(profile)} strikes in the profile, {len(photo) // 1024} KB)')

          async def trade(db):
              alerted = trade_alerts.alerted_strategies()
              rows = (await db.execute(select(PaperNativeTrade, Strategy.name)
                      .join(PaperNativeDeployment, PaperNativeDeployment.id == PaperNativeTrade.deployment_id)
                      .join(Strategy, Strategy.id == PaperNativeDeployment.strategy_id)
                      .order_by(PaperNativeTrade.closed_at.desc()).limit(200))).all()
              picked = next(((t, n.strip()) for t, n in rows if n.strip().lower() in alerted), None)
              if picked is None:
                  return print('trade picture: no closed trade of an alerted strategy')
              t, name = picked
              spot = (await db.execute(select(PcrSnapshot.spot).where(PcrSnapshot.underlying == 'NIFTY', PcrSnapshot.ts <= t.closed_at,
                      PcrSnapshot.spot.is_not(None)).order_by(PcrSnapshot.ts.desc()).limit(1))).scalar_one_or_none()

              async def price_of(_):
                  return spot  # NIFTY at the record the trade closed on or after

              session = await trade_alerts.Session().load(db, t.closed_at, price_of if spot is not None else None)
              closed = {'legs': t.legs, 'pnl': t.pnl, 'charges': t.charges, 'exit_reason': t.exit_reason,
                        'opened_at': t.opened_at, 'closed_at': t.closed_at}
              photo = await trade_alerts._picture(lambda: trade_alerts.exit_chart(name, session, closed, view_of(t.legs), session.live))
              day_net, day_trades = await trade_alerts._day_net(db, t.deployment_id, t.closed_at)
              subject, body = trade_alerts.exit_message(name, closed, day_net, day_trades)
              await send_telegram('Preview · ' + subject, body, photo=photo)
              print(f'trade picture: {\"sent\" if photo else \"not drawn (text sent)\"} ({len(session.candles)} candles, '
                    f'forming {\"yes\" if session.recent.forming else \"no\"})')

          async def main():
              for part in (oi, trade):
                  async with AsyncSessionLocal() as db:
                      try:
                          await part(db)
                      except Exception as exc:
                          print(f'{part.__name__}: failed ({type(exc).__name__})')
          asyncio.run(main())
          " 2>/dev/null || echo "failed"
              ;;
            py)
              # $2: a read-only Python script from backend/scripts, already
              # uploaded (removed once run), run inside the backend container.
              trap 'rm -f "$2"' EXIT
              compose exec -T backend python - < "$2" 2>/dev/null || echo "failed"
              ;;
          esac
          REMOTE

          vps() {
            ssh -i ~/.ssh/vps -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
              -o ConnectTimeout=20 "root@$VPS_HOST" "$@"
          }
          remote() { vps bash -s -- "$@" < "$RUNNER_TEMP/remote.sh"; }

          if [ "${KOTAK_DATA_CHECK:-false}" = "true" ]; then
            echo "== Kotak Neo market data against Zerodha's (read-only)"
            py_file=$(vps 'f=$(mktemp /tmp/kotak-XXXXXX.py) && cat > "$f" && echo "$f"' < backend/scripts/kotak_data_check.py)
            remote py "$py_file"
            exit 0
          fi

          if [ "${BREAKOUT_BACKTEST:-false}" = "true" ]; then
            echo "== 52 Candle Breakout 15 MIN backtest (results to the private Telegram chat only; counts and dates here)"
            py_file=$(vps 'f=$(mktemp /tmp/breakout-XXXXXX.py) && cat > "$f" && echo "$f"' < backend/scripts/breakout_backtest.py)
            remote py "$py_file"
            exit 0
          fi

          if [ "${OI_PREVIEW:-false}" = "true" ]; then
            echo "== OI-levels and trade-alert pictures (private chat only)"
            remote oi-preview
            exit 0
          fi

          echo "== Containers"
          remote status

          # Uploaded over stdin: passed base64-encoded as one argument, the
          # query file outgrew Linux's 128 KB limit on a single argument.
          sql_file=$(vps 'f=$(mktemp /tmp/health-XXXXXX.sql) && cat > "$f" && echo "$f"' < backend/scripts/backfill_health_summary.sql)
          remote sql "$sql_file"

          echo
          echo "== Backend log lines in the last 72 hours matching (count)"
          remote log-counts

          echo
          echo "== Today on the site since 09:00 IST (counts only)"
          remote web-today

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/vps
