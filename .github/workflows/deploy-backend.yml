name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tradingmaster-api:latest

      - name: Redeploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            # A registry/network hiccup mid-script must abort the deploy,
            # not silently fall through to "up -d" with no new image --
            # this already happened on the frontend workflow once: a
            # transient registry failure left the old container running
            # while the health check passed against stale code with no
            # error anywhere in the log. set -e plus explicit retry-then-
            # fail (not retry-then-continue) closes that gap here too.
            set -e

            # Log in with the same short-lived token this workflow run
            # already has (GITHUB_TOKEN, scoped only to this repo) --
            # works whether ghcr.io/splasious/tradingmaster-api is public
            # (today) or private (once the repo itself goes private,
            # which normally makes its packages private too). No
            # long-lived credential is stored on the VPS; a fresh token
            # is used every deploy.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /opt/tradingmaster

            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml --env-file .env pull backend && break
              if [ "$i" = 3 ]; then
                echo "::error::pull backend failed after 3 attempts"
                exit 1
              fi
              echo "pull backend failed (attempt $i), retrying in 10s..."
              sleep 10
            done

            # Docker's container removal during recreate is async and can
            # still be in flight from a just-finished prior deploy, racing
            # this one with "removal of container ... already in progress" --
            # retry rather than fail the whole deploy on that transient race.
            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml --env-file .env up -d backend && break
              if [ "$i" = 3 ]; then
                echo "::error::up -d backend failed after 3 attempts"
                exit 1
              fi
              echo "up -d backend failed (attempt $i), retrying in 5s..."
              sleep 5
            done

      - name: Wait for health check
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://api.tradingmaster.online/api/v1/system/health || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy."
              exit 0
            fi
            echo "Not healthy yet (attempt $i, status $code), waiting..."
            sleep 10
          done
          echo "::error::Backend did not become healthy after redeploy"
          exit 1
